name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Decide which parts of the monorepo this PR touches.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
      stack: ${{ steps.f.outputs.stack }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            stack:
              - 'backend/**'
              - 'frontend/**'
              - 'docker-compose*.yml'

  backend-checks:
    name: backend-checks
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  frontend-checks:
    name: frontend-checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Builds both images from this PR's code and boots the real stack through nginx.
  compose-smoke-test:
    name: compose-smoke-test
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: local
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - name: Build and start stack
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build --wait --wait-timeout 180
      - name: Smoke test through the frontend proxy
        run: |
          curl -fsS http://localhost:8080/api/health
          curl -fsS -X POST http://localhost:8080/api/games \
            -H 'Content-Type: application/json' -d '{"title":"Smoke Test Game"}'
          curl -fsS http://localhost:8080/api/games | grep -q "Smoke Test Game"
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml logs
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v

  # The ONE check (besides pr-title) that branch protection requires. Jobs skipped by
  # the path filter count as fine; failed or cancelled jobs fail the gate. This keeps
  # the required-checks list stable even as jobs are added or skipped.
  ci-gate:
    name: ci-gate
    if: always()
    needs: [changes, backend-checks, frontend-checks, compose-smoke-test]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
