[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# NOTE: PyPI names are global. Check that this one is free, or rename it
# (also rename in release-please-config.json and boardgames_api/__init__.py).
name = "boardgames-catalog-api"
version = "0.1.0" # managed by release-please, do not edit by hand
description = "Board games catalog API (FastAPI + PostgreSQL)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["boardgames_api"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
